<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #05010d;
    font-family: Arial, sans-serif;
}

.titulo {
    position: fixed;
    top: 30px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 70px;
    font-weight: bold;
    text-shadow: 0 0 20px #ff1493;
}

.mensaje {
    position: absolute;
    color: white;
    text-shadow: 0 0 10px #ff1493;
    animation: aparecer 3s ease-in-out forwards;
}

@keyframes aparecer {
    0% {
        opacity: 0;
        transform: scale(0);
    }
    50% {
        opacity: 1;
        transform: scale(1.4);
    }
    100% {
        opacity: 0.8;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<div class="titulo">TE AMO ❤️</div>

<script>

const frases = [
"Te Amo ❤️",
"Mi amor",
"My love",
"Eres preciosa",
"Me encantas❤️",
"i love you  ❤️",
"❤️Amor de mi vida",
"Te extraño ❤️",
"laura mi lugar favorito eres tu❤️❤️❤️❤️",
"love ❤️"
];

function crearMensaje() {

    const mensaje = document.createElement("div");

    mensaje.className = "mensaje";

    mensaje.innerText =
        frases[Math.floor(Math.random() * frases.length)];

    mensaje.style.left =
        Math.random() * 90 + "vw";

    mensaje.style.top =
        Math.random() * 90 + "vh";

    mensaje.style.fontSize =
        (15 + Math.random() * 25) + "px";

    document.body.appendChild(mensaje);

    setTimeout(() => {
        mensaje.remove();
    }, 5000);
}

setInterval(crearMensaje, 200);

</script>
